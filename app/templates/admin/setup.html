<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create admin · Catering</title><link rel="stylesheet" href="/static/css/app.css"></head><body>
<div class="auth-shell"><div class="auth-card"><div class="brand"><span class="brand-mark">A</span><span>Catering Admin</span></div><h1 style="font-size:2rem;margin-top:20px">Create the first admin</h1><p class="muted">This page is available only until the first admin account is created.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/admin/setup"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field" style="margin-top:12px"><label>Password</label><input name="password" type="password" autocomplete="new-password" minlength="10" required><span class="help">Minimum 10 characters.</span></div><div class="field" style="margin-top:12px"><label>Confirm password</label><input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></div><button class="btn block" style="margin-top:16px" type="submit">Create admin</button></form></div></div></body></html>
