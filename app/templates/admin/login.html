<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · Catering</title><link rel="stylesheet" href="/static/css/app.css"></head><body>
<div class="auth-shell"><div class="auth-card"><div class="brand"><span class="brand-mark">A</span><span>Catering Admin</span></div><h1 style="font-size:2rem;margin-top:20px">Admin login</h1><p class="muted">Manage quotes, orders, customers, menus and business details.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/admin/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field" style="margin-top:12px"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn block" style="margin-top:16px" type="submit">Log in</button></form><a class="btn ghost block" href="/" style="margin-top:8px">Back to website</a></div></div></body></html>
