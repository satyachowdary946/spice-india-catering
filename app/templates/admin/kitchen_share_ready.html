{% extends "admin/admin_base.html" %}
{% block title %}Kitchen Share · {{ order.order_number }}{% endblock %}
{% block body %}
<div class="admin-title"><div><div class="eyebrow">Kitchen Share</div><h1>{{ order.order_number }}</h1></div><a class="btn secondary" href="/admin/orders/{{ order.id }}#kitchen-actions">Back To Order</a></div>
<section class="card kitchen-share-ready-card">
  <div class="actions"><a class="btn secondary" href="{{ pdf_url }}" target="_blank" rel="noopener">Open Kitchen PDF</a><button class="btn secondary" type="button" data-copy-kitchen>Copy Kitchen Message</button></div>
  <div class="field" style="margin-top:14px"><label>Prepared Message</label><textarea data-kitchen-message readonly rows="12">{{ kitchen_message }}</textarea></div>
</section>
<script>(()=>{const t=document.querySelector('[data-kitchen-message]');const copy=async()=>{try{await navigator.clipboard.writeText(t.value);return true}catch{return false}};document.querySelector('[data-copy-kitchen]')?.addEventListener('click',async e=>{const ok=await copy();e.currentTarget.textContent=ok?'Copied ✓':'Select & Copy';if(!ok){t.focus();t.select();}});})();</script>
{% endblock %}
